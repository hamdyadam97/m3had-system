name: Deploy m3had-system

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
                    cd /var/www/m3had-system

                    # نسخ احتياطي لقاعدة البيانات الحية قبل أي عملية reset
                    # (لازم لأن db.sqlite3 اتشالت من git ومن الممكن الـ reset --hard يمسحها لو لقاها متتبعة قديمًا)
                    if [ -f db.sqlite3 ]; then
                        cp db.sqlite3 db.sqlite3.bak
                    fi

                    git fetch origin main
                    git reset --hard origin/main

                    # استعادة قاعدة البيانات الحية لو الـ reset مسحها (أول مرة بعد إلغاء تتبعها في git)
                    if [ ! -f db.sqlite3 ] && [ -f db.sqlite3.bak ]; then
                        cp db.sqlite3.bak db.sqlite3
                    fi

                    source venv/bin/activate
                    pip install -r requirements.txt
                    python manage.py migrate --noinput
        
                    # تحديث الملفات الثابتة
                    python manage.py collectstatic --noinput
        
                    # الضربة القاضية: ضبط الصلاحيات للملف ليعمل اللوجن
                    sudo chown www-data:www-data /var/www/m3had-system/db.sqlite3
                    sudo chmod 664 /var/www/m3had-system/db.sqlite3
                    
                    
                    # إعادة التشغيل الإجبارية للـ Gunicorn ليرى البيانات الجديدة
                    sudo systemctl restart gunicorn
            
                    # إعادة تشغيل الـ Celery لضمان تنفيذ المهام بالكود الجديد
                    sudo systemctl restart celery